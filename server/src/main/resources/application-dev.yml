spring:
  datasource:
    url: ${PETLINK_DB_URL:jdbc:mysql://127.0.0.1:3306/petlink?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${PETLINK_DB_USER:root}
    password: ${PETLINK_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

petlink:
  jwt:
    secret: ${PETLINK_JWT_SECRET}

  cors:
    allowed-origins:
      - ${PETLINK_CORS_ORIGIN_PC:http://localhost:5173}
      - ${PETLINK_CORS_ORIGIN_PC_IP:http://127.0.0.1:5173}
      - ${PETLINK_CORS_ORIGIN_MOBILE:http://localhost:5174}
      - ${PETLINK_CORS_ORIGIN_MOBILE_IP:http://127.0.0.1:5174}
      # The reproducible local Docker stack serves the built PC and Mobile
      # clients from Nginx on port 8081. Browsers include an Origin header on
      # JSON POSTs even when the page and API share that origin, so the bundled
      # web origin must be allowed as well as the Vite/UniApp dev ports above.
      - ${PETLINK_CORS_ORIGIN_BUNDLED:http://localhost:8081}
      - ${PETLINK_CORS_ORIGIN_BUNDLED_IP:http://127.0.0.1:8081}
