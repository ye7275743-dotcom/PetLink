# The two clients share this origin: PC at `/`, UniApp H5 at `/mobile/`.
# Keep the decision at the neutral entry point only; explicit `/mobile/` links
# are never bounced back to PC, which prevents redirect loops.
map $http_user_agent $petlink_device_by_ua {
    default pc;
    ~*(android|iphone|ipod|ipad|mobile|blackberry|iemobile|opera\ mini|tablet) mobile;
}

map $cookie_petlink_view $petlink_preferred_device {
    default "";
    pc pc;
    mobile mobile;
}

map "$petlink_preferred_device:$petlink_device_by_ua" $petlink_entry_device {
    default pc;
    ~^mobile: mobile;
    ~^:mobile$ mobile;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Preserve the externally mapped port (currently 8081) in redirects.
    absolute_redirect off;
    client_max_body_size 6m;
    sendfile on;
    tcp_nopush on;
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location = /health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /mobile/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # User-selected view preferences are reversible and intentionally use 302.
    location = /view/mobile {
        add_header Set-Cookie "petlink_view=mobile; Path=/; Max-Age=2592000; SameSite=Lax" always;
        return 302 /mobile/;
    }

    location = /view/pc {
        add_header Set-Cookie "petlink_view=pc; Path=/; Max-Age=2592000; SameSite=Lax" always;
        return 302 /;
    }

    location = /view/auto {
        add_header Set-Cookie "petlink_view=; Path=/; Max-Age=0; SameSite=Lax" always;
        return 302 /;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /mobile/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    # Only the neutral root is device-routed. Deep links without an equivalent
    # mobile screen remain on PC so that their business context is not lost.
    location = / {
        add_header Vary "User-Agent, Cookie" always;
        if ($petlink_entry_device = mobile) { return 302 /mobile/; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
